environments:
  dev:
    values:
      - ../params-dev.yaml
      -
        self:
          namespace: unique

---

repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts

releases:
  # enables managed prometheus to scrape for ContainerInsights
  - name: ama-metrics-prometheus-config
    namespace: kube-system
    chart: bedag/raw
    version: {{ .Values.versions.charts.raw }}
    wait: false
    values:
      - ../values/default/ama-metrics-prometheus-config.yaml.gotmpl
      {{- if isFile "values/{{ .Environment.Name }}/ama-metrics-prometheus-config.yaml.gotmpl" }}
      - ../values/{{ .Environment.Name }}/ama-metrics-prometheus-config.yaml.gotmpl
      {{- end }}

  # Configures Log Collection settings for Log Analytics Workspace Table ContainerLogV2
  - name: container-azm-ms-agentconfig
    namespace: kube-system
    chart: bedag/raw
    version: {{ .Values.versions.charts.raw }}
    wait: false
    values:
      - ../values/default/container-azm-ms-agentconfig.yaml.gotmpl
      {{- if isFile "values/{{ .Environment.Name }}/container-azm-ms-agentconfig.yaml.gotmpl" }}  
      - ../values/{{ .Environment.Name }}/container-azm-ms-agentconfig.yaml.gotmpl
      {{- end }}

  - name: storage-class-zrs
    chart: bedag/raw
    version: {{ .Values.versions.charts.raw }}
    namespace: {{ .Values.self.namespace }}
    createNamespace: true
    wait: false
    values:
      - ../values/default/storage-class-zrs.yaml.gotmpl
      {{- if isFile "values/{{ .Environment.Name }}/storage-class-zrs.yaml.gotmpl" }}
      - ../values/{{ .Environment.Name }}/storage-class-zrs.yaml.gotmpl
      {{- end }}


  - name: apiextensions.k8s.io
    chart: bedag/raw
    version: {{ .Values.versions.charts.raw }}
    namespace: {{ .Values.self.namespace }}
    createNamespace: true
    wait: false
    values:
      - ../values/default/apiextensions.k8s.io-v1.2.0.crds.yaml
      {{- if isFile "values/{{ .Environment.Name }}/apiextensions.k8s.io-v1.2.0.crds.yaml" }}
      - ../values/{{ .Environment.Name }}/apiextensions.k8s.io-v1.2.0.crds.yaml
      {{- end }}
