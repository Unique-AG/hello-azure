image:
  tag: "2025.10"
  repository: uqhacrtest.azurecr.io/backend-service-scope-management
env:
  ZITADEL_HOST: https://id.hello.azure.unique.test
extraRoutes:
  scim:
    enabled: true
    annotations:
      konghq.com/plugins: unique-route-metrics
    parentRefs:
      - name: kong
        namespace: unique
        group: gateway.networking.k8s.io
        kind: Gateway
    hostnames:
      - api.hello.azure.unique.test
    matches:
      - path:
          type: PathPrefix
          value: /scim
secretProvider:
  vaults:
    hakv2test:
      DATABASE_URL: database-url-scope-management
    hakv1test:
      ZITADEL_PAT: manual-zitadel-scope-mgmt-pat
