env:
  MAX_HEAP_MB: 400
# todo: A workaround to redirect the root route to the chat route is needed due to
# https://github.com/Kong/kubernetes-ingress-controller/issues/6851
nodeSelector:
  scalability: steady
  lifecycle: persistent
probes:
  liveness:
    httpGet:
      path: /chat/api/health
      port: http
    initialDelaySeconds: 5
  readiness:
    httpGet:
      path: /chat/api/health
      port: http
    initialDelaySeconds: 5
replicaCount: 2
resources:
  limits:
    cpu: 300m
    memory: 550Mi
  requests:
    cpu: 300m
    memory: 500Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /chat
  paths:
    default:
      enabled: true # todo: once kong released and we tested the newer kong version, we can again default here and remove the extraObjects and extraRoutes
    root:
      enabled: false
      redirectPath: /chat
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
strategy:
  type: Recreate
