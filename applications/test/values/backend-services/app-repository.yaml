auditVolume:
  enabled: true
  mountPath: /audit
  attributes:
    resourceGroup: ref+azurekeyvault://hakv2test/audit-storage-resource-group
    storageAccount: ref+azurekeyvault://hakv2test/audit-storage-account-name
image:
  tag: "2025.44.1"
  repository: uqhacrtest.azurecr.io/backend-service-app-repository
routes:
  hostname: api.test-hello.azure.unique.dev
secretProvider:
  vaults:
    hakv2test:
      DATABASE_URL: database-url-app-repository
      ENCRYPTION_KEY: encryption-key-app-repository
      AUDIT_STORAGE_RESOURCE_GROUP: audit-storage-resource-group
      AUDIT_STORAGE_ACCOUNT_NAME: audit-storage-account-name
serviceAccount:
  enabled: true
  workloadIdentity:
    clientId: 2ffd1adb-50e7-4a89-bbef-26f6f944e2d3
    enabled: true
