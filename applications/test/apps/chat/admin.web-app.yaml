spec:
  name: web-app-admin
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure'
      targetRevision: preview
      ref: values
    - repoURL: https://github.com/Unique-AG/helm-charts
      path: charts/web-app
      chart: web-app
      targetRevision: "feat/UN-11292-security-hardening"
      helm:
        releaseName: web-app-admin
        valueFiles: 
          - $values/applications/defaults/web-apps/admin.yaml
          - $values/applications/test/values/web-apps/_all.yaml
          - $values/applications/test/values/web-apps/admin.yaml
        valuesObject: {}
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"