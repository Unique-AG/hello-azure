spec:
  name: backend-service-ingestion-worker-chat
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure'
      targetRevision: preview
      ref: values
    - repoURL: ghcr.io/unique-ag/helm-charts
      chart: backend-service
      targetRevision: 3.3.1
      helm:
        releaseName: backend-service-ingestion-worker-chat
        valueFiles:
          - $values/applications/defaults/backend-services/ingestion-worker.yaml
          - $values/applications/test/values/backend-services/_all.yaml
          - $values/applications/test/values/backend-services/ingestion-worker.yaml
        valuesObject:
          env:
            INGESTION_QUEUE: chat_queue
          eventBasedAutoscaling:
            enabled: false
          keda:
            enabled: true
            minReplicaCount: 0
            maxReplicaCount: 5
            scalers:
              - type: rabbitmq
                metadata:
                  protocol: amqp
                  queueName: unique.node.ingestion.chat_queue
                  mode: QueueLength
                  value: "1"
                authenticationRef:
                  name: rabbitmqcluster-chat-unique-user
  ignoreDifferences:
    - group: "apps"
      kind: Deployment
      jsonPointers:
        - /spec/replicas
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"