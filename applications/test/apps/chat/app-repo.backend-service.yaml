spec:
  name: backend-service-app-repository
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure'
      targetRevision: preview
      ref: values
    - repoURL: https://github.com/Unique-AG/helm-charts.git
      path: charts/backend-service/
      targetRevision: feat/allow-defining-network-policies
      helm:
        releaseName: backend-service-app-repository
        valueFiles:
          - $values/applications/defaults/backend-services/app-repository.yaml
          - $values/applications/test/values/backend-services/_all.yaml
          - $values/applications/test/values/backend-services/app-repository.yaml
        valuesObject: {}
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"