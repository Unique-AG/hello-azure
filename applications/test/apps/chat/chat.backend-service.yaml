spec:
  name: backend-service-chat
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure'
      targetRevision: preview
      ref: values
    - repoURL: ghcr.io/unique-ag/helm-charts
      chart: backend-service
      targetRevision: 4.6.2
      helm:
        releaseName: backend-service-chat
        valueFiles:
          - $values/applications/defaults/backend-services/chat.yaml
          - $values/applications/test/values/backend-services/_all.yaml
          - $values/applications/test/values/backend-services/chat.yaml
        valuesObject:
          securityContext:
            allowPrivilegeEscalation: true
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"