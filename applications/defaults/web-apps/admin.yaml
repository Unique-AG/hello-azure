env:
  MAX_HEAP_MB: 350
  FEATURE_FLAG_ENABLE_ENDPOINT_MODULES_UN_15310: "true"
  FEATURE_FLAG_ENABLE_SPACES_2_0_UN_11203: "true"
  FEATURE_FLAG_ENABLE_SPACE_LANDING_PAGE_UN_9930: "true"
nodeSelector:
  scalability: steady
  lifecycle: persistent
probes:
  liveness:
    httpGet:
      path: /admin/api/health
      port: http
    initialDelaySeconds: 5
  readiness:
    httpGet:
      path: /admin/api/health
      port: http
    initialDelaySeconds: 5
replicaCount: 2
resources:
  limits:
    cpu: 300m
    memory: 500Mi
  requests:
    cpu: 300m
    memory: 450Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /admin
  paths:
    default:
      enabled: true
strategy:
  type: Recreate
