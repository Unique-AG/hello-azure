auditVolume:
  enabled: true
  mountPath: /audit
  attributes:
    resourceGroup: unset_default_value
    storageAccount: unset_default_value
env:
  AUDIT_LOG_DIR: /audit
  LOG_LEVEL: info
  MAX_HEAP_MB: 200
  PG_DATABASE_SSL_MODE: "verify"
hooks:
  migration:
    command: |
      cd /home/node/app/services/configuration-backend/prisma; npx prisma migrate deploy;
    enabled: true
replicaCount: 1
resources:
  limits:
    cpu: 100m
    memory: 350Mi
  requests:
    cpu: 100m
    memory: 300Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /configuration
  paths:
    default:
      enabled: true
    probe:
      enabled: true
service:
  port: 8095
