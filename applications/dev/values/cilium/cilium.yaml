aksbyocni:
  enabled: true
cluster: # only needed for cluster mesh
  name: hello-azure-dev
  id: 1
resources:
  limits:
    memory: 200Mi
  requests:
    cpu: 50m
    memory: 200Mi

hubble: # TODO: to be deleted
  relay:
    enabled: true
  ui:
    enabled: true
    ingress:
      enabled: true
      className: kong
      annotations:
        konghq.com/plugins: unique-jwt-auth
      hosts:
        - hubble.hello.azure.unique.dev
authentication:
  mutual:
    spire:
      enabled: true
      install:
        enabled: true