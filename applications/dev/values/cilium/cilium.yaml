aksbyocni:
  enabled: true
cluster: # only needed for cluster mesh
  name: hello-azure-dev
  id: 1
resources:
  limits:
    memory: 200Mi
  requests:
    cpu: 50m
    memory: 200Mi

hubble:
  ui:
    enabled: true
    ingress:
      enabled: true
      className: kong
      annotations:
        konghq.com/preserve-host: "true"
        konghq.com/headers.x-forwarded-proto: "https"
        konghq.com/headers.x-forwarded-host: "hubble.hello.azure.unique.dev"
        konghq.com/strip-path: "false"
      hosts:
        - hubble.hello.azure.unique.dev