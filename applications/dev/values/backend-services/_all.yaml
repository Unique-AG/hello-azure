env:
  CORS_ALLOWED_ORIGINS: https://hello.azure.unique.dev
  ZITADEL_PROJECT_ID: "305512913743905383"
  UNIQUE_INSTALLATION_ID: hello.azure.unique.dev # the hostname of the cluster
networkPolicy:
  enabled: true
  flavor: cilium
  ingress:
    - fromEndpoints:
      - matchLabels:
          "k8s:io.kubernetes.pod.namespace": unique
      authentication:
        mode: "required"
  egress:
    - toPorts:
      - ports:
        - port: "53"
          protocol: UDP
        - port: "53"
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          "k8s:io.kubernetes.pod.namespace": unique
      authentication:
        mode: "required"
    - toFQDNs:
        - matchName: "login.microsoftonline.com"
      toPorts:
        - ports:
          - port: "443"
            protocol: TCP
    # Allow egress to PostgreSQL subnet
    - toCIDR:
      - 10.201.3.48/28
      toPorts:
        - ports:
          - port: "5432"
            protocol: TCP
    # Allow egress to Redis subnet
    - toCIDR:
      - 10.201.3.64/28
      toPorts:
        - ports:
          - port: "6379"
            protocol: TCP
    # Allow egress to Storage subnet
    - toCIDR:
      - 10.201.3.80/28
      toPorts:
        - ports:
          - port: "443"
            protocol: TCP
    # Allow egress to Key Vault subnet
    - toCIDR:
      - 10.201.3.32/28
      toPorts:
        - ports:
          - port: "443"
            protocol: TCP
    # Allow egress to Cognitive Services subnet
    - toCIDR:
      - 10.201.3.16/28
      toPorts:
        - ports:
          - port: "443"
            protocol: TCP
routes:
  hostname: api.hello.azure.unique.dev
secretProvider:
  useVMManagedIdentity: "true"
  tenantId: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
  userAssignedIdentityID: 874387d6-a672-4ee9-9de5-b9b2dc4d2b61
resources: # TODO: @PROD-CHANGE: these are minimal resources. Remove this override for more reasonalbe perfromance
  requests:
    cpu: 50m
    memory: 220Mi