env:
  CORS_ALLOWED_ORIGINS: https://hello.azure.unique.dev
  ZITADEL_PROJECT_ID: "305512913743905383"
  UNIQUE_INSTALLATION_ID: hello.azure.unique.dev # the hostname of the cluster
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: unique
  egress:
    # Allow DNS resolution
    - to:
      ports:
        - protocol: UDP
          port: 53
      - namespaceSelector:
          matchLabels:
            name: kube-system
    - to: # PostgreSQL
      ports:
        - protocol: TCP # PostgreSQL port
          port: 5432
      - ipBlock:
          cidr: "10.201.3.48/28" # PostgreSQL subnet
    - to: # Redis
      - ipBlock:
          cidr: "10.201.3.64/28"
    - to: # storage
      - ipBlock:
          cidr: "10.201.3.80/28" 
    - to: # key vault
      - ipBlock:
          cidr: "10.201.3.32/28"
    - to: # cognitive services
      - ipBlock:
          cidr: "10.201.3.16/28"
    - to:
      - namespaceSelector:
          matchLabels:
            name: unique
routes:
  hostname: api.hello.azure.unique.dev
secretProvider:
  useVMManagedIdentity: "true"
  tenantId: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
  userAssignedIdentityID: 656b2988-6508-4df3-ba88-5a0d721863ae