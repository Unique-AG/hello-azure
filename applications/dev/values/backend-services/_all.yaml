env:
  CORS_ALLOWED_ORIGINS: https://hello.azure.unique.dev
  ZITADEL_PROJECT_ID: "305512913743905383"
  UNIQUE_INSTALLATION_ID: hello.azure.unique.dev # the hostname of the cluster
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: unique
  egress:
    # Allow DNS resolution
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # # Allow all external traffic (outside the cluster)
    # - to: []
    #   ports:
        # - protocol: TCP
        #   port: 443  # HTTPS
        # - protocol: TCP
        #   port: 80   # HTTP
        # - protocol: TCP
        #   port: 5432 # PostgreSQL
    - to: # PostgreSQL
      ports:
        - protocol: TCP # PostgreSQL port
          port: 5432
      - ipBlock:
          cidr: "10.201.3.48/28" # PostgreSQL subnet
    - to: # Redis
      - ipBlock:
          cidr: "10.201.3.64/28"
    - to: # storage
      - ipBlock:
          cidr: "10.201.3.80/28" 
    - to: # key vault
      - ipBlock:
          cidr: "10.201.3.32/28"
    - to: # cognitive services
      - ipBlock:
          cidr: "10.201.3.16/28"
    # - to:
    #   - ipBlock:
    #       cidr: "20.33.171.0/24"
    # - to:
    #   - ipBlock:
    #       cidr: "20.60.78.0/23"
    # - to:
    #   - ipBlock:
    #       cidr: "20.60.234.0/23"
    # - to:
    #   - ipBlock:
    #       cidr: "20.60.252.0/23"
    # - to:
    #   - ipBlock:
    #       cidr: "20.150.44.0/24"
    # - to:
    #   - ipBlock:
    #       cidr: "20.150.120.0/24"
    # - to:
    #   - ipBlock:
    #       cidr: "20.153.8.0/24"
    # - to:
    #   - ipBlock:
    #       cidr: "20.157.151.0/24"
    # - to:
    #   - ipBlock:
    #       cidr: "20.157.232.0/24"
    # - to:
    #   - ipBlock:
    #       cidr: "20.209.216.0/23"
    # - to:
