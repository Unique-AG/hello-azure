env:
  CORS_ALLOWED_ORIGINS: https://hello.azure.unique.dev
  ZITADEL_PROJECT_ID: "305512913743905383"
  UNIQUE_INSTALLATION_ID: hello.azure.unique.dev # the hostname of the cluster
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: unique
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow all external traffic (outside the cluster)
    - to: []
      ports:
        - protocol: TCP
          port: 443  # HTTPS
        - protocol: TCP
          port: 80   # HTTP
        - protocol: TCP
          port: 5432 # PostgreSQL
    - to:
      - ipBlock:
          cidr: "0.0.0.0/0"
    - to:
      - ipBlock:
          cidr: "20.33.171.0/24"
    - to:
      - ipBlock:
          cidr: "20.60.78.0/23"
    - to:
      - ipBlock:
          cidr: "20.60.234.0/23"
    - to:
      - ipBlock:
          cidr: "20.60.252.0/23"
    - to:
      - ipBlock:
          cidr: "20.150.44.0/24"
    - to:
      - ipBlock:
          cidr: "20.150.120.0/24"
    - to:
      - ipBlock:
          cidr: "20.153.8.0/24"
    - to:
      - ipBlock:
          cidr: "20.157.151.0/24"
    - to:
      - ipBlock:
          cidr: "20.157.232.0/24"
    - to:
      - ipBlock:
          cidr: "20.209.216.0/23"
    - to:
      - ipBlock:
          cidr: "57.150.58.0/23"
    - to:
      - ipBlock:
          cidr: "2603:1020:1005::/48"
    # Allow specific internal cluster services only
    - to:
      - namespaceSelector:
          matchLabels:
            name: unique
routes:
  hostname: api.hello.azure.unique.dev
secretProvider:
  useVMManagedIdentity: "true"
  tenantId: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
  userAssignedIdentityID: 656b2988-6508-4df3-ba88-5a0d721863ae