    # Allow egress to PostgreSQL subnet
    - toCIDR:
      - 10.201.3.48/28
      toPorts:
        - ports:
          - port: "5432"
            protocol: TCP
    # Allow egress to Redis subnet
    - toCIDR:
      - 10.201.3.64/28
    # Allow egress to Storage subnet
    - toCIDR:
      - 10.201.3.80/28
    # Allow egress to Key Vault subnet
    - toCIDR:
      - 10.201.3.32/28
    # Allow egress to Cognitive Services subnet
