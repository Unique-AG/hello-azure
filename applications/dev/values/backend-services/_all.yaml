env:
  CORS_ALLOWED_ORIGINS: https://hello.azure.unique.dev
  ZITADEL_PROJECT_ID: "305512913743905383"
  UNIQUE_INSTALLATION_ID: hello.azure.unique.dev # the hostname of the cluster
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: unique
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow all external traffic (outside the cluster)
    - to: []
      ports:
        # - protocol: TCP
        #   port: 443  # HTTPS
        # - protocol: TCP
        #   port: 80   # HTTP
        - protocol: TCP
          port: 5432 # PostgreSQL
    # Allow specific internal cluster services only
    - to:
      - namespaceSelector:
          matchLabels:
            name: unique
routes:
  hostname: api.hello.azure.unique.dev
secretProvider:
  useVMManagedIdentity: "true"
  tenantId: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
  userAssignedIdentityID: 656b2988-6508-4df3-ba88-5a0d721863ae