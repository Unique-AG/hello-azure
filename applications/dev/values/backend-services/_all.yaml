    - fromEndpoints:
      - matchLabels:
          "k8s:io.kubernetes.pod.namespace": unique
      authentication:
        mode: "required"
  egress:
    - toPorts:
      - ports:
        - port: "53"
          protocol: UDP
        - port: "53"
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          "k8s:io.kubernetes.pod.namespace": unique
      authentication:
