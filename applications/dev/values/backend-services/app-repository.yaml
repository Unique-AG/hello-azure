env:
  AUDIT_LOG_DIR: /audit
serviceAccount:
  enabled: true
  workloadIdentity:
    clientId: 0f7cd773-a53a-4b58-8835-146dd20e281b
    enabled: true
image:
  tag: "2025.42"
  repository: uniquehelloazure.azurecr.io/backend-service-app-repository
routes:
  hostname: api.hello.azure.unique.dev
secretProvider:
  vaults:
    helloazuresensitive:
      DATABASE_URL: database-url-app-repository
      ENCRYPTION_KEY: encryption-key-app-repository
      AUDIT_STORAGE_RESOURCE_GROUP: audit-storage-resource-group
      AUDIT_STORAGE_ACCOUNT_NAME: audit-storage-account-name
auditVolume:
  enabled: true
  mountPath: /audit
  resourceGroup: AUDIT_STORAGE_RESOURCE_GROUP
  storageAccount: AUDIT_STORAGE_ACCOUNT_NAME
