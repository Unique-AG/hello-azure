auditVolume:
  enabled: false
volumeMounts:
  - name: audit
    mountPath: /audit
volumes:
  - name: audit
    persistentVolumeClaim:
      claimName: '{{ include "backendService.fullname" . }}-audit'
image:
  tag: "2025.46"
  repository: uniquehelloazure.azurecr.io/backend-service-app-repository
routes:
  hostname: api.hello.azure.unique.dev
secretProvider:
  vaults:
    helloazuresensitive:
      DATABASE_URL: database-url-app-repository
      ENCRYPTION_KEY: encryption-key-app-repository
serviceAccount:
  enabled: true
  workloadIdentity:
    clientId: 0f7cd773-a53a-4b58-8835-146dd20e281b
    enabled: true
