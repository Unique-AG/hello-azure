spec:
  name: backend-service-chat
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure'
      targetRevision: preview
      ref: values
    - repoURL: https://github.com/Unique-AG/helm-charts.git
      path: charts/backend-service/
      targetRevision: feat/allow-defining-network-policies
      helm:
        releaseName: backend-service-chat
        valueFiles:
          - $values/applications/defaults/backend-services/chat.yaml
          - $values/applications/dev/values/backend-services/_all.yaml
          - $values/applications/dev/values/backend-services/chat.yaml
        valuesObject: {}