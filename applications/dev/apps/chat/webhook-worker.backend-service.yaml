spec:
  name: backend-service-webhook-worker
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure'
      targetRevision: preview
      ref: values
    - repoURL: https://github.com/Unique-AG/helm-charts.git
      chart: charts/backend-service/
      targetRevision: feat/allow-defining-network-policies
      helm:
        releaseName: backend-service-webhook-worker
        valueFiles:
          - $values/applications/defaults/backend-services/webhook-worker.yaml
          - $values/applications/dev/values/backend-services/_all.yaml
          - $values/applications/dev/values/backend-services/webhook-worker.yaml
        valuesObject: {}
