spec:
  name: web-app-knowledge-upload
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure'
      targetRevision: preview
      ref: values
    - repoURL: https://github.com/Unique-AG/helm-charts.git
      chart: charts/web-app/
      targetRevision: feat/allow-defining-network-policies
      helm:
        releaseName: web-app-knowledge-upload
        valueFiles: 
          - $values/applications/defaults/web-apps/knowledge-upload.yaml
          - $values/applications/dev/values/web-apps/_all.yaml
          - $values/applications/dev/values/web-apps/knowledge-upload.yaml
        valuesObject: {}
