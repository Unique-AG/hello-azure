spec:
  name: cilium
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure'
      targetRevision: preview
      ref: values
    - chart: cilium
      repoURL: https://helm.cilium.io/
      targetRevision: 1.17.5
      helm:
        releaseName: cilium
        valueFiles:
          - $values/applications/dev/values/cilium/cilium.yaml
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
        - /data/ca.key
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: hubble-server-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key