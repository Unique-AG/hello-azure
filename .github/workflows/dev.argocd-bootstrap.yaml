name: '[dev][bootstrap ArgoCD] 🐙'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false # otherwise helm upgrade can get stuck and one needs to manually clean the secrets and helm database

on:
  workflow_dispatch:
    inputs:
      action:
        description: "helmfile action to perform: apply, diff or template."
        default: diff
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  cilium-bootstrap:
    uses: ./.github/workflows/dev.helm.yaml
    with:
      file_name: applications/cilium-bootstrap.yaml
      action: ${{ inputs.action }}
    secrets: inherit

  argo-bootstrap:
    uses: ./.github/workflows/dev.helm.yaml
    with:
      file_name: applications/argo-bootstrap.yaml
      action: ${{ inputs.action }}
    secrets: inherit
