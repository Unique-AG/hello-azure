name: "[tf] [test] Infrastructure Apply 🏗️"
on:
  pull_request:
    branches:
      - preview
    paths:
      - .github/workflows/test.infrastructure.tf.yaml
      - infrastructure/test/**
      - terraform-modules/**
  push:
    branches:
      - preview
      - chore/enable-test-workflows
    paths:
      - .github/workflows/test.infrastructure.tf.yaml
      - infrastructure/test/**
      - terraform-modules/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # To write comments
  id-token: write

jobs:
  automated-plan-apply:
    environment: 10-pm
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infrastructure/test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3.1.2
        with:
          terraform_version: 1.12.0

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init -backend-config=config.auto.tfvars

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color

      - name: Purge soft-deleted cognitive account
        run: |
          az account set --subscription 782871a0-bcee-44fb-851f-ccd3e69ada2a
          # List soft-deleted accounts to verify
          az cognitiveservices account deleted list --location swedencentral || echo "No soft-deleted accounts found or command failed"
          # Purge the soft-deleted cognitive account
          az cognitiveservices account purge \
            --location swedencentral \
            --resource-group resource-group-core \
            --name cognitive-account-swedencentral || echo "Account may not be soft-deleted or already purged"

      - name: Import existing resources
        run: |
          # Resource Group
          terraform import azurerm_resource_group.vnet /subscriptions/782871a0-bcee-44fb-851f-ccd3e69ada2a/resourceGroups/rg-vnet-002 || true
          
          # Resource Provider Registrations (in perimeter module)
          terraform import module.perimeter.azurerm_resource_provider_registration.azure_dashboard_provider /subscriptions/782871a0-bcee-44fb-851f-ccd3e69ada2a/providers/Microsoft.Dashboard || true
          terraform import module.perimeter.azurerm_resource_provider_registration.azure_monitor_provider /subscriptions/782871a0-bcee-44fb-851f-ccd3e69ada2a/providers/Microsoft.Monitor || true
          terraform import module.perimeter.azurerm_resource_provider_registration.azure_alerts_provider /subscriptions/782871a0-bcee-44fb-851f-ccd3e69ada2a/providers/Microsoft.AlertsManagement ||
  
      - name: Terraform Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/chore/enable-test-workflows') || (github.event_name == 'pull_request' && github.head_ref == 'chore/enable-test-workflows') #'refs/heads/preview'
        run: terraform apply -auto-approve -input=true